<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#5b5bf0">
<title>تقييمات المعلمين | نظام الغياب الذكي</title>
<script>(function(){try{var t=JSON.parse(localStorage.getItem('uiTheme'));if(!t&&matchMedia('(prefers-color-scheme: dark)').matches)t='dark';if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}})()</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
/* ===== نظام الغياب الذكي — التصميم الموحد ===== */
:root{
  --primary:#5b5bf0; --primary-2:#8b5cf6; --primary-soft:#eef0ff; --primary-ink:#3730a3;
  --success:#10b981; --success-soft:#dcfce7; --warning:#f59e0b; --warning-soft:#fef3c7;
  --danger:#ef4444; --danger-soft:#fee2e2; --info:#0ea5e9; --info-soft:#e0f2fe;
  --bg:#f5f6fb; --bg-2:#eceefa; --surface:#ffffff; --surface-2:#f8f9fd; --border:#e4e7f2;
  --text:#1e1b4b; --text-2:#475569; --muted:#8a93ab;
  --radius:18px; --radius-sm:12px;
  --shadow:0 1px 2px rgba(30,27,75,.04),0 8px 24px rgba(30,27,75,.06);
  --shadow-lg:0 20px 50px rgba(30,27,75,.18);
  --grad:linear-gradient(135deg,var(--primary),var(--primary-2));
  color-scheme:light;
}
[data-theme="dark"]{
  --primary:#7c7cff; --primary-2:#a78bfa; --primary-soft:#24244a; --primary-ink:#c7c9ff;
  --success-soft:#0f3a2c; --warning-soft:#3d2f0b; --danger-soft:#3f1717; --info-soft:#0b2f42;
  --bg:#0d0f1c; --bg-2:#141730; --surface:#161a2e; --surface-2:#1c2038; --border:#2a2f4d;
  --text:#eef0ff; --text-2:#b8bfd9; --muted:#7d86a6;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;font-family:'Tajawal',system-ui,sans-serif;background:var(--bg);color:var(--text);
  min-height:100vh;line-height:1.6;padding-bottom:56px;
  background-image:radial-gradient(circle at 100% 0,rgba(91,91,240,.10),transparent 40%),radial-gradient(circle at 0 100%,rgba(139,92,246,.08),transparent 45%);
  background-attachment:fixed}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--primary)}
.hidden{display:none!important}

/* ===== الشريط العلوي ===== */
.topbar{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--surface) 85%,transparent);
  backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--border)}
.topbar-inner{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 20px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:17px;white-space:nowrap;text-decoration:none;color:var(--text)}
.brand-logo{width:36px;height:36px;border-radius:11px;background:var(--grad);display:grid;place-items:center;color:#fff;font-size:18px;box-shadow:0 6px 16px rgba(91,91,240,.35)}
.nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;padding:2px}
.nav::-webkit-scrollbar{display:none}
.nav a{display:flex;align-items:center;gap:6px;padding:8px 13px;border-radius:10px;text-decoration:none;color:var(--text-2);font-weight:700;font-size:14px;white-space:nowrap;transition:.15s}
.nav a:hover{background:var(--surface-2);color:var(--text)}
.nav a.active{background:var(--primary-soft);color:var(--primary-ink)}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--border);background:var(--surface);cursor:pointer;display:grid;place-items:center;font-size:17px;flex-shrink:0;transition:.15s}
.icon-btn:hover{border-color:var(--primary);transform:translateY(-1px)}

/* ===== التخطيط ===== */
.page{max-width:1280px;margin:0 auto;padding:24px 20px}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.page-title{margin:0;font-size:28px;font-weight:900;letter-spacing:-.3px}
.page-sub{margin:4px 0 0;color:var(--muted);font-weight:500}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.card-title{margin:0 0 14px;font-size:17px;font-weight:800;display:flex;align-items:center;gap:8px}
.grid{display:grid;gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

/* ===== البطاقات الإحصائية ===== */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);display:flex;align-items:center;gap:14px}
.stat-ico{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:22px;flex-shrink:0}
.stat-label{color:var(--muted);font-weight:700;font-size:13px}
.stat-value{font-size:26px;font-weight:900;line-height:1.1}
.tone-primary{background:var(--primary-soft);color:var(--primary)}
.tone-success{background:var(--success-soft);color:var(--success)}
.tone-warning{background:var(--warning-soft);color:var(--warning)}
.tone-danger{background:var(--danger-soft);color:var(--danger)}
.tone-info{background:var(--info-soft);color:var(--info)}

/* ===== الأزرار والحقول ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid transparent;border-radius:12px;padding:10px 16px;font-weight:800;font-size:14px;cursor:pointer;transition:.15s;white-space:nowrap;text-decoration:none;line-height:1.2}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--grad);color:#fff;box-shadow:0 6px 16px rgba(91,91,240,.28)}
.btn-primary:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 10px 22px rgba(91,91,240,.36)}
.btn-ghost{background:var(--surface);border-color:var(--border);color:var(--text)}
.btn-ghost:hover:not(:disabled){border-color:var(--primary);color:var(--primary)}
.btn-soft{background:var(--primary-soft);color:var(--primary-ink)}
.btn-success{background:var(--success);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger-soft{background:var(--danger-soft);color:var(--danger)}
.btn-danger-soft:hover:not(:disabled){background:var(--danger);color:#fff}
.btn-sm{padding:7px 11px;font-size:13px;border-radius:10px}
.btn-block{width:100%}
.field{position:relative}
.input,.select,.textarea{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:12px;background:var(--surface);outline:none;transition:.15s;font-size:15px}
.input:focus,.select:focus,.textarea:focus{border-color:var(--primary);box-shadow:0 0 0 4px color-mix(in srgb,var(--primary) 15%,transparent)}
.search{padding-inline-start:40px}
.field .field-ico{position:absolute;inset-inline-start:13px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}

/* ===== الشارات والرقائق ===== */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--border);background:var(--surface);border-radius:999px;padding:6px 13px;font-weight:700;font-size:14px;cursor:pointer;transition:.15s;user-select:none}
.chip:hover{border-color:var(--primary)}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:7px 13px;border-radius:9px;font-weight:800;font-size:13px;cursor:pointer;color:var(--text-2)}
.seg button.on{background:var(--surface);color:var(--primary-ink);box-shadow:var(--shadow)}

/* ===== الجداول ===== */
.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}
table.table{width:100%;border-collapse:collapse;font-size:15px}
.table th{position:sticky;top:0;background:var(--surface-2);color:var(--text-2);font-weight:800;font-size:13px;text-align:right;padding:12px 14px;border-bottom:1px solid var(--border);white-space:nowrap}
.table td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
.table tr:last-child td{border-bottom:0}
.table tbody tr{transition:background .12s}
.table tbody tr:hover{background:var(--surface-2)}

/* ===== القوائم ===== */
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:.15s}
.item:hover{border-color:var(--primary);transform:translateY(-1px);box-shadow:var(--shadow)}
.item.dim{opacity:.62}
.avatar{width:42px;height:42px;border-radius:13px;background:var(--primary-soft);color:var(--primary-ink);display:grid;place-items:center;font-weight:900;flex-shrink:0}
.item-main{flex:1;min-width:0}
.item-title{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-meta{color:var(--muted);font-size:13px;display:flex;gap:12px;flex-wrap:wrap;margin-top:2px}

/* ===== الحالات ===== */
.empty{text-align:center;color:var(--muted);padding:48px 16px;font-weight:600}
.empty-ico{font-size:42px;display:block;margin-bottom:8px;opacity:.7}
.spinner{width:34px;height:34px;border:3.5px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 10px}
@keyframes spin{to{transform:rotate(360deg)}}
.skeleton{background:linear-gradient(90deg,var(--surface-2),var(--border),var(--surface-2));background-size:200% 100%;animation:sk 1.2s infinite;border-radius:12px;height:58px}
@keyframes sk{to{background-position:-200% 0}}
.alert{padding:12px 16px;border-radius:12px;font-weight:700;display:flex;gap:10px;align-items:center}
.alert-danger{background:var(--danger-soft);color:var(--danger)}
.alert-warning{background:var(--warning-soft);color:#b45309}
[data-theme="dark"] .alert-warning{color:var(--warning)}
.fade-in{animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ===== النوافذ المنبثقة ===== */
.modal{position:fixed;inset:0;z-index:1000;background:rgba(13,15,40,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex;animation:fadeIn .2s}
.modal-card{background:var(--surface);border-radius:22px;box-shadow:var(--shadow-lg);width:100%;max-width:520px;max-height:90vh;overflow:auto;padding:24px;border:1px solid var(--border)}
.modal-card.sm{max-width:380px;text-align:center}
.modal-title{margin:0 0 6px;font-size:20px;font-weight:900}
.modal-text{color:var(--text-2);margin:0 0 18px}
.modal-actions{display:flex;gap:10px;margin-top:20px}
.modal-actions .btn{flex:1}
.kv{display:grid;gap:12px}
.kv-row{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:10px 14px}
.kv-k{font-size:12px;color:var(--muted);font-weight:800}
.kv-v{font-weight:700;word-break:break-word;white-space:pre-wrap}
.pin{display:flex;justify-content:center;gap:10px;direction:ltr;margin:8px 0 4px}
.pin input{width:54px;height:62px;text-align:center;font-size:26px;font-weight:900;border:2px solid var(--border);border-radius:14px;background:var(--surface-2);outline:none}
.pin input:focus{border-color:var(--primary);background:var(--surface)}
.pin.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* ===== الإشعارات ===== */
.toasts{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:2000;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(92vw,420px)}
.toast{pointer-events:auto;background:var(--text);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:700;box-shadow:var(--shadow-lg);display:flex;gap:10px;align-items:center;animation:toastIn .25s ease;width:100%}
.toast.success{background:#065f46;color:#fff}.toast.error{background:#991b1b;color:#fff}.toast.info{background:var(--primary-ink);color:#fff}
[data-theme="dark"] .toast.info{background:#3730a3}
@keyframes toastIn{from{opacity:0;transform:translateY(-10px)}}

/* ===== التذييل ===== */
.footer{position:fixed;bottom:0;inset-inline:0;height:40px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--muted);background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--border);z-index:40}
.footer b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

@media (max-width:720px){
  .topbar-inner{flex-wrap:wrap;padding:10px 14px;gap:10px}
  .nav{order:3;flex-basis:100%}
  .brand span.brand-text{display:inline}
  .page{padding:18px 14px}
  .page-title{font-size:23px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .stat{padding:12px;gap:10px}.stat-ico{width:38px;height:38px;font-size:18px;border-radius:11px}
  .stat-value{font-size:21px}.stat-label{font-size:12px}
  .table{font-size:14px}.table td,.table th{padding:10px}
  .modal-card{padding:20px}
}
@media print{
  .topbar,.footer,.no-print,.toasts{display:none!important}
  body{background:#fff;padding:0;color:#000}
  .card,.table-wrap,.stat{box-shadow:none;border-color:#ccc}
}
</style>

<style>
  .stars{color:#f59e0b;letter-spacing:2px;font-size:16px;white-space:nowrap}
  .stars .off{color:var(--border)}
  .dist{display:grid;gap:6px}
  .dist-row{display:grid;grid-template-columns:44px 1fr 34px;gap:10px;align-items:center;font-weight:800;font-size:13px}
  .bar{height:10px;background:var(--surface-2);border-radius:999px;overflow:hidden;border:1px solid var(--border)}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,#fbbf24,#f59e0b);border-radius:999px}
  .summary{display:grid;grid-template-columns:220px 1fr;gap:20px;align-items:center}
  .big{font-size:56px;font-weight:900;line-height:1}
  @media(max-width:640px){.summary{grid-template-columns:1fr;text-align:center}}
</style>
</head>
<body>
<header class="topbar no-print">
  <div class="topbar-inner">
    <button class="brand ai-launch" id="aiaFab" title="المساعد الذكي" aria-label="فتح المساعد الذكي"><span class="brand-logo aia-pulse">✦</span><span class="brand-text">المساعد الذكي</span></button>
    <span class="spacer"></span>
    <button class="icon-btn" id="themeBtn" title="الوضع الليلي" aria-label="تبديل الوضع الليلي">🌙</button>
  </div>
</header>

<main class="page">
  <div class="page-head">
    <div><h1 class="page-title">تقييمات المعلمين</h1><p class="page-sub">آراء المعلمين ومقترحاتهم حول النظام</p></div>
    <div class="row no-print"><button class="btn btn-ghost" id="refreshBtn">🔄 تحديث</button></div>
  </div>

  <div class="card summary" style="margin-bottom:16px">
    <div style="text-align:center"><div class="big" id="avg">—</div><div class="stars" id="avgStars" style="font-size:22px"></div><div style="color:var(--muted);font-weight:700" id="cnt"></div></div>
    <div class="dist" id="dist"></div>
  </div>

  <div class="card" style="margin-bottom:16px">
    <div class="row">
      <div class="field" style="flex:1;min-width:220px"><span class="field-ico">🔎</span><input class="input search" id="search" placeholder="ابحث باسم المعلم أو في المقترحات..."></div>
      <select class="select" id="starFilter" style="width:auto"><option value="">كل النجوم</option><option value="5">5 نجوم</option><option value="4">4 نجوم</option><option value="3">3 نجوم</option><option value="2">نجمتان</option><option value="1">نجمة واحدة</option></select>
      <div class="seg" id="seg"><button data-f="new" class="on">جديد <span id="newCount"></span></button><button data-f="read">تمت المراجعة</button><button data-f="all">الكل</button></div>
    </div>
  </div>

  <div class="list" id="list"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>
</main>

<div class="modal" id="modal">
  <div class="modal-card">
    <div class="row" style="margin-bottom:14px"><div class="avatar" id="mAvatar"></div><div><h3 class="modal-title" id="mName" style="margin:0"></h3><div class="stars" id="mStars"></div></div><span class="spacer"></span><span class="badge" id="mStatus"></span></div>
    <div class="kv">
      <div class="kv-row"><div class="kv-k">المقترحات / الملاحظات</div><div class="kv-v" id="mText"></div></div>
      <div class="row" style="gap:12px">
        <div class="kv-row" style="flex:1"><div class="kv-k">التاريخ</div><div class="kv-v" id="mDate"></div></div>
        <div class="kv-row" style="flex:1"><div class="kv-k">البريد الإلكتروني</div><div class="kv-v" id="mEmail" dir="ltr" style="text-align:right"></div></div>
      </div>
    </div>
    <div class="modal-actions" style="flex-wrap:wrap">
      <a class="btn btn-primary" id="replyBtn">✉️ رد بالبريد</a>
      <button class="btn btn-success" id="toggleBtn"></button>
      <button class="btn btn-ghost" id="closeBtn">إغلاق</button>
    </div>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="modal" id="uiDialog" role="dialog" aria-modal="true">
  <div class="modal-card sm">
    <div id="uiDialogIco" style="font-size:40px;margin-bottom:6px">⚠️</div>
    <h3 class="modal-title" id="uiDialogTitle"></h3>
    <p class="modal-text" id="uiDialogText"></p>
    <div class="pin hidden" id="uiPin">
      <input type="password" inputmode="numeric" maxlength="1" autocomplete="off">
      <input type="password" inputmode="numeric" maxlength="1" autocomplete="off">
      <input type="password" inputmode="numeric" maxlength="1" autocomplete="off">
      <input type="password" inputmode="numeric" maxlength="1" autocomplete="off">
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="uiDialogCancel">إلغاء</button>
      <button class="btn btn-primary" id="uiDialogOk">تأكيد</button>
    </div>
  </div>
</div>
<footer class="footer">برمجة الطالب&nbsp;<b>يحيى حميد</b>&nbsp;| جميع الحقوق محفوظة ©</footer>
<script>
/* ===== أدوات مشتركة ===== */
const UI = (() => {
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  // الوضع الليلي
  function applyTheme(t) { document.documentElement.setAttribute('data-theme', t); const b = document.getElementById('themeBtn'); if (b) b.textContent = t === 'dark' ? '☀️' : '🌙'; }
  applyTheme(store.get('uiTheme', (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light'));
  function toggleTheme() { const t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'; store.set('uiTheme', t); applyTheme(t); document.dispatchEvent(new CustomEvent('themechange', { detail: t })); }

  function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

  function toast(msg, type = 'info', ms = 3200) {
    const wrap = document.getElementById('toasts'); if (!wrap) return;
    const ico = { success: '✅', error: '⛔', info: 'ℹ️' }[type] || 'ℹ️';
    const el = document.createElement('div'); el.className = 'toast ' + type;
    el.innerHTML = `<span>${ico}</span><span>${esc(msg)}</span>`;
    wrap.appendChild(el);
    setTimeout(() => { el.style.transition = '.3s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, ms);
  }

  // نافذة تأكيد / رمز سري — ترجع Promise
  function dialog({ title, text = '', icon = '⚠️', okText = 'تأكيد', danger = false, pin = null }) {
    return new Promise(resolve => {
      const m = document.getElementById('uiDialog');
      const pinBox = document.getElementById('uiPin');
      const inputs = [...pinBox.querySelectorAll('input')];
      const ok = document.getElementById('uiDialogOk'), cancel = document.getElementById('uiDialogCancel');
      document.getElementById('uiDialogTitle').textContent = title;
      document.getElementById('uiDialogText').textContent = text;
      document.getElementById('uiDialogIco').textContent = icon;
      ok.textContent = okText; ok.className = 'btn ' + (danger ? 'btn-danger' : 'btn-primary');
      pinBox.classList.toggle('hidden', !pin); ok.classList.toggle('hidden', !!pin);
      inputs.forEach(i => i.value = '');
      const close = (v) => { m.classList.remove('open'); ok.onclick = cancel.onclick = m.onclick = null; inputs.forEach(i => { i.oninput = i.onkeydown = null; }); document.removeEventListener('keydown', onKey); resolve(v); };

<script>
const URL_ = "https://script.google.com/macros/s/AKfycbxh__1yqzRm9GCYWjUwRZnYRoDIEes7X0DaMzu3U-XIhf_TtKLcVucyFOOHo4wxHo4N/exec";

async function load() {
  $('refreshBtn').disabled = true;
  try {
    const res = await fetch(URL_, { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    items = (Array.isArray(data) ? data : []).map(r => ({
      date: String(r.date || ''), name: r.name || 'بدون اسم', email: r.email || '', rating: parseInt(UI.toEn(r.rating)) || 0,
      suggestion: (r.suggestion || '').toString().trim(),

  } catch (e) {
    console.error(e);
    $('list').innerHTML = `<div class="alert alert-danger">⛔ تعذّر جلب التقييمات من Google Sheets. تأكد من الاتصال ثم اضغط «تحديث».</div>`;
  } finally { $('refreshBtn').disabled = false; }
}

function renderSummary() {
  const n = items.length, sum = items.reduce((s, r) => s + r.rating, 0), avg = n ? sum / n : 0;

}
function render() {
  renderSummary();
  const q = $('search').value.trim(), sf = $('starFilter').value;
  const list = items.filter(r => (filter === 'all' || (filter === 'read') === isRead(r)) && (!sf || r.rating === +sf) && (!q || `${r.name} ${r.suggestion}`.includes(q)));
  $('list').innerHTML = list.length ? list.map(r => `

}

function openItem(id) {
  current = items.find(r => r.id === id); if (!current) return;
  const r = current;
  $('mAvatar').textContent = UI.initials(r.name); $('mName').textContent = r.name; $('mStars').innerHTML = stars(r.rating);
  $('mText').textContent = r.suggestion || 'لا توجد مقترحات'; $('mDate').textContent = r.date || '-'; $('mEmail').textContent = r.email || '-';

  setStatusUI(); $('modal').classList.add('open');
}
function setStatusUI() {
  const d = isRead(current);
  $('mStatus').className = 'badge ' + (d ? 'tone-success' : 'tone-primary'); $('mStatus').textContent = d ? 'تمت المراجعة' : 'جديد';
  $('toggleBtn').textContent = d ? '↩️ تعليم كجديد' : '✅ تمت المراجعة'; $('toggleBtn').className = 'btn ' + (d ? 'btn-ghost' : 'btn-success');
}
const closeItem = () => { $('modal').classList.remove('open'); current = null; };
async function toggle() {
  const r = current; if (!r) return;
  const val = isRead(r) ? null : Date.now();
  if (val) status[r.id] = val; else delete status[r.id];
  UI.store.set('readRatingsV2', status); render(); setStatusUI();
  try { if (db) await db.ref(`${STATUS_PATH}/${r.id}`).set(val); }
  catch (e) { fbOk = false; UI.toast('حُفظت الحالة على هذا الجهاز فقط (تعذّر الحفظ في Firebase)', 'info', 4500); }
  if (val) closeItem();
}

$('list').addEventListener('click', e => { const it = e.target.closest('[data-id]'); if (it) openItem(it.dataset.id); });
$('closeBtn').onclick = closeItem; $('toggleBtn').onclick = toggle;
$('modal').addEventListener('click', e => { if (e.target.id === 'modal') closeItem(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeItem(); });
$('search').addEventListener('input', render); $('starFilter').addEventListener('change', render);
$('seg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; filter = b.dataset.f; [...$('seg').children].forEach(x => x.classList.toggle('on', x === b)); render(); });
$('refreshBtn').onclick = load;
if (db) db.ref(STATUS_PATH).on('value', s => { if (!fbOk) return; status = s.val() || {}; UI.store.set('readRatingsV2', status); if (items.length) render(); }, () => { fbOk = false; });
load();
</script>

<script>

    let html = '', list = null, table = [];
    const fl = () => { if (list) { html += `</${list}>`; list = null; } };
    const ft = () => { if (!table.length) return; const rows = table.filter(r => !/^\s*\|?\s*:?-{2,}/.test(r)).map(r => r.trim().replace(/^\||\|$/g, '').split('|')); html += '<table>' + rows.map((r, i) => '<tr>' + r.map(c => i ? `<td>${inline(c.trim())}</td>` : `<th>${inline(c.trim())}</th>`).join('') + '</tr>').join('') + '</table>'; table = []; };
