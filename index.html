<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#5b5bf0">
<title>سجل الغياب | نظام الغياب الذكي</title>
<script>(function(){try{var t=JSON.parse(localStorage.getItem('uiTheme'));if(!t&&matchMedia('(prefers-color-scheme: dark)').matches)t='dark';if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}})()</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
/* ===== نظام الغياب الذكي — التصميم الموحد ===== */
:root{
  --primary:#5b5bf0; --primary-2:#8b5cf6; --primary-soft:#eef0ff; --primary-ink:#3730a3;
  --success:#10b981; --success-soft:#dcfce7; --warning:#f59e0b; --warning-soft:#fef3c7;
  --danger:#ef4444; --danger-soft:#fee2e2; --info:#0ea5e9; --info-soft:#e0f2fe;
  --bg:#f5f6fb; --bg-2:#eceefa; --surface:#ffffff; --surface-2:#f8f9fd; --border:#e4e7f2;
  --text:#1e1b4b; --text-2:#475569; --muted:#8a93ab;
  --radius:18px; --radius-sm:12px;
  --shadow:0 1px 2px rgba(30,27,75,.04),0 8px 24px rgba(30,27,75,.06);
  --shadow-lg:0 20px 50px rgba(30,27,75,.18);
  --grad:linear-gradient(135deg,var(--primary),var(--primary-2));
  color-scheme:light;
}
[data-theme="dark"]{
  --primary:#7c7cff; --primary-2:#a78bfa; --primary-soft:#24244a; --primary-ink:#c7c9ff;
  --success-soft:#0f3a2c; --warning-soft:#3d2f0b; --danger-soft:#3f1717; --info-soft:#0b2f42;
  --bg:#0d0f1c; --bg-2:#141730; --surface:#161a2e; --surface-2:#1c2038; --border:#2a2f4d;
  --text:#eef0ff; --text-2:#b8bfd9; --muted:#7d86a6;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;font-family:'Tajawal',system-ui,sans-serif;background:var(--bg);color:var(--text);
  min-height:100vh;line-height:1.6;padding-bottom:56px;
  background-image:radial-gradient(circle at 100% 0,rgba(91,91,240,.10),transparent 40%),radial-gradient(circle at 0 100%,rgba(139,92,246,.08),transparent 45%);
  background-attachment:fixed}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--primary)}
.hidden{display:none!important}

/* ===== الشريط العلوي ===== */
.topbar{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--surface) 85%,transparent);
  backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--border)}
.topbar-inner{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 20px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:17px;white-space:nowrap;text-decoration:none;color:var(--text)}
.brand-logo{width:36px;height:36px;border-radius:11px;background:var(--grad);display:grid;place-items:center;color:#fff;font-size:18px;box-shadow:0 6px 16px rgba(91,91,240,.35)}
.nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;padding:2px}
.nav::-webkit-scrollbar{display:none}
.nav a{display:flex;align-items:center;gap:6px;padding:8px 13px;border-radius:10px;text-decoration:none;color:var(--text-2);font-weight:700;font-size:14px;white-space:nowrap;transition:.15s}
.nav a:hover{background:var(--surface-2);color:var(--text)}
.nav a.active{background:var(--primary-soft);color:var(--primary-ink)}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--border);background:var(--surface);cursor:pointer;display:grid;place-items:center;font-size:17px;flex-shrink:0;transition:.15s}
.icon-btn:hover{border-color:var(--primary);transform:translateY(-1px)}

/* ===== التخطيط ===== */
.page{max-width:1280px;margin:0 auto;padding:24px 20px}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.page-title{margin:0;font-size:28px;font-weight:900;letter-spacing:-.3px}
.page-sub{margin:4px 0 0;color:var(--muted);font-weight:500}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.card-title{margin:0 0 14px;font-size:17px;font-weight:800;display:flex;align-items:center;gap:8px}
.grid{display:grid;gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

/* ===== البطاقات الإحصائية ===== */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);display:flex;align-items:center;gap:14px}
.stat-ico{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:22px;flex-shrink:0}
.stat-label{color:var(--muted);font-weight:700;font-size:13px}
.stat-value{font-size:26px;font-weight:900;line-height:1.1}
.tone-primary{background:var(--primary-soft);color:var(--primary)}
.tone-success{background:var(--success-soft);color:var(--success)}
.tone-warning{background:var(--warning-soft);color:var(--warning)}
.tone-danger{background:var(--danger-soft);color:var(--danger)}
.tone-info{background:var(--info-soft);color:var(--info)}

/* ===== الأزرار والحقول ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid transparent;border-radius:12px;padding:10px 16px;font-weight:800;font-size:14px;cursor:pointer;transition:.15s;white-space:nowrap;text-decoration:none;line-height:1.2}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--grad);color:#fff;box-shadow:0 6px 16px rgba(91,91,240,.28)}
.btn-primary:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 10px 22px rgba(91,91,240,.36)}
.btn-ghost{background:var(--surface);border-color:var(--border);color:var(--text)}
.btn-ghost:hover:not(:disabled){border-color:var(--primary);color:var(--primary)}
.btn-soft{background:var(--primary-soft);color:var(--primary-ink)}
.btn-success{background:var(--success);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger-soft{background:var(--danger-soft);color:var(--danger)}
.btn-danger-soft:hover:not(:disabled){background:var(--danger);color:#fff}
.btn-sm{padding:7px 11px;font-size:13px;border-radius:10px}
.btn-block{width:100%}
.field{position:relative}
.input,.select,.textarea{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:12px;background:var(--surface);outline:none;transition:.15s;font-size:15px}
.input:focus,.select:focus,.textarea:focus{border-color:var(--primary);box-shadow:0 0 0 4px color-mix(in srgb,var(--primary) 15%,transparent)}
.search{padding-inline-start:40px}
.field .field-ico{position:absolute;inset-inline-start:13px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}

/* ===== الشارات والرقائق ===== */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--border);background:var(--surface);border-radius:999px;padding:6px 13px;font-weight:700;font-size:14px;cursor:pointer;transition:.15s;user-select:none}
.chip:hover{border-color:var(--primary)}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:7px 13px;border-radius:9px;font-weight:800;font-size:13px;cursor:pointer;color:var(--text-2)}
.seg button.on{background:var(--surface);color:var(--primary-ink);box-shadow:var(--shadow)}

/* ===== الجداول ===== */
.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}
table.table{width:100%;border-collapse:collapse;font-size:15px}
.table th{position:sticky;top:0;background:var(--surface-2);color:var(--text-2);font-weight:800;font-size:13px;text-align:right;padding:12px 14px;border-bottom:1px solid var(--border);white-space:nowrap}
.table td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
.table tr:last-child td{border-bottom:0}
.table tbody tr{transition:background .12s}
.table tbody tr:hover{background:var(--surface-2)}

/* ===== القوائم ===== */
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:.15s}
.item:hover{border-color:var(--primary);transform:translateY(-1px);box-shadow:var(--shadow)}
.item.dim{opacity:.62}
.avatar{width:42px;height:42px;border-radius:13px;background:var(--primary-soft);color:var(--primary-ink);display:grid;place-items:center;font-weight:900;flex-shrink:0}
.item-main{flex:1;min-width:0}
.item-title{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-meta{color:var(--muted);font-size:13px;display:flex;gap:12px;flex-wrap:wrap;margin-top:2px}

/* ===== الحالات ===== */
.empty{text-align:center;color:var(--muted);padding:48px 16px;font-weight:600}
.empty-ico{font-size:42px;display:block;margin-bottom:8px;opacity:.7}
.spinner{width:34px;height:34px;border:3.5px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 10px}
@keyframes spin{to{transform:rotate(360deg)}}
.skeleton{background:linear-gradient(90deg,var(--surface-2),var(--border),var(--surface-2));background-size:200% 100%;animation:sk 1.2s infinite;border-radius:12px;height:58px}
@keyframes sk{to{background-position:-200% 0}}
.alert{padding:12px 16px;border-radius:12px;font-weight:700;display:flex;gap:10px;align-items:center}
.alert-danger{background:var(--danger-soft);color:var(--danger)}
.alert-warning{background:var(--warning-soft);color:#b45309}
[data-theme="dark"] .alert-warning{color:var(--warning)}
.fade-in{animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ===== النوافذ المنبثقة ===== */
.modal{position:fixed;inset:0;z-index:1000;background:rgba(13,15,40,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex;animation:fadeIn .2s}
.modal-card{background:var(--surface);border-radius:22px;box-shadow:var(--shadow-lg);width:100%;max-width:520px;max-height:90vh;overflow:auto;padding:24px;border:1px solid var(--border)}
.modal-card.sm{max-width:380px;text-align:center}
.modal-title{margin:0 0 6px;font-size:20px;font-weight:900}
.modal-text{color:var(--text-2);margin:0 0 18px}
.modal-actions{display:flex;gap:10px;margin-top:20px}
.modal-actions .btn{flex:1}
.kv{display:grid;gap:12px}
.kv-row{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:10px 14px}
.kv-k{font-size:12px;color:var(--muted);font-weight:800}
.kv-v{font-weight:700;word-break:break-word;white-space:pre-wrap}
.pin{display:flex;justify-content:center;gap:10px;direction:ltr;margin:8px 0 4px}
.pin input{width:54px;height:62px;text-align:center;font-size:26px;font-weight:900;border:2px solid var(--border);border-radius:14px;background:var(--surface-2);outline:none}
.pin input:focus{border-color:var(--primary);background:var(--surface)}
.pin.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* ===== الإشعارات ===== */
.toasts{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:2000;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(92vw,420px)}
.toast{pointer-events:auto;background:var(--text);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:700;box-shadow:var(--shadow-lg);display:flex;gap:10px;align-items:center;animation:toastIn .25s ease;width:100%}
.toast.success{background:#065f46;color:#fff}.toast.error{background:#991b1b;color:#fff}.toast.info{background:var(--primary-ink);color:#fff}
[data-theme="dark"] .toast.info{background:#3730a3}
@keyframes toastIn{from{opacity:0;transform:translateY(-10px)}}

/* ===== التذييل ===== */
.footer{position:fixed;bottom:0;inset-inline:0;height:40px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--muted);background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--border);z-index:40}
.footer b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

@media (max-width:720px){
  .topbar-inner{flex-wrap:wrap;padding:10px 14px;gap:10px}
  .nav{order:3;flex-basis:100%}
  .brand span.brand-text{display:inline}
  .page{padding:18px 14px}
  .page-title{font-size:23px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .stat{padding:12px;gap:10px}.stat-ico{width:38px;height:38px;font-size:18px;border-radius:11px}
  .stat-value{font-size:21px}.stat-label{font-size:12px}
  .table{font-size:14px}.table td,.table th{padding:10px}
  .modal-card{padding:20px}
}
@media print{
  .topbar,.footer,.no-print,.toasts{display:none!important}
  body{background:#fff;padding:0;color:#000}
  .card,.table-wrap,.stat{box-shadow:none;border-color:#ccc}
}
</style>

<style>
  .class-filter{margin-bottom:18px}
  .level-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 0;border-bottom:1px dashed var(--border)}
  .level-row:last-child{border-bottom:0}
  .level-name{font-weight:900;min-width:70px;color:var(--text-2);cursor:pointer}
  .level-name:hover{color:var(--primary)}
  .count-pill{min-width:34px;justify-content:center}
  .days{display:flex;flex-wrap:wrap;gap:6px;padding:4px 0}
  .day{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:4px 6px 4px 10px;font-size:13px;font-weight:700}
  .day button{border:0;background:var(--danger-soft);color:var(--danger);width:22px;height:22px;border-radius:7px;cursor:pointer;font-size:12px;line-height:1}
  .day button:hover{background:var(--danger);color:#fff}
  tr.expand td{background:var(--surface-2)}
  .student-cell{font-weight:800;cursor:pointer}
  .student-cell .arrow{display:inline-block;transition:.2s;color:var(--muted);margin-inline-end:6px}
  tr.open .arrow{transform:rotate(-90deg)}
  .toolbar{display:grid;grid-template-columns:1fr 200px auto;gap:10px;margin-bottom:14px}
  @media(max-width:720px){.toolbar{grid-template-columns:1fr 1fr}.toolbar .field{grid-column:1/-1}}
</style>
</head>
<body>
<header class="topbar no-print">
  <div class="topbar-inner">
    <button class="brand ai-launch" id="aiaFab" title="المساعد الذكي" aria-label="فتح المساعد الذكي"><span class="brand-logo aia-pulse">✦</span><span class="brand-text">المساعد الذكي</span></button>
    <span class="spacer"></span>
    <button class="icon-btn" id="themeBtn" title="الوضع الليلي" aria-label="تبديل الوضع الليلي">🌙</button>
  </div>
</header>

<main class="page">
  <div class="page-head">
    <div>
      <h1 class="page-title">سجل الغياب</h1>
      <p class="page-sub">جميع الغيابات المسجلة من المعلمين، مع البحث والتصفية والتصدير</p>
    </div>
    <div class="row no-print">
      <button class="btn btn-ghost" id="refreshBtn">🔄 تحديث</button>
      <button class="btn btn-ghost" id="exportBtn">⬇️ تصدير Excel</button>
      <button class="btn btn-ghost" onclick="window.print()">🖨️ طباعة</button>
      <button class="btn btn-danger-soft" id="deleteAllBtn">🗑️ حذف الكل</button>
    </div>
  </div>

  <section class="stats">
    <div class="stat"><div class="stat-ico tone-primary">📄</div><div><div class="stat-label">إجمالي السجلات</div><div class="stat-value" id="sTotal">—</div></div></div>
    <div class="stat"><div class="stat-ico tone-danger">👤</div><div><div class="stat-label">الطلاب في النتائج</div><div class="stat-value" id="sStudents">—</div></div></div>
    <div class="stat"><div class="stat-ico tone-warning">📅</div><div><div class="stat-label">غياب اليوم</div><div class="stat-value" id="sToday">—</div></div></div>
    <div class="stat"><div class="stat-ico tone-info">🏫</div><div><div class="stat-label">صفوف فيها غياب</div><div class="stat-value" id="sClasses">—</div></div></div>
  </section>

  <div class="card no-print" style="margin-bottom:16px">
    <div class="toolbar">
      <div class="field"><span class="field-ico">🔎</span><input class="input search" id="search" placeholder="ابحث باسم الطالب أو المعلم أو الصف..."></div>
      <input class="input" type="date" id="dateFilter" title="تصفية بالتاريخ">
      <div class="seg" id="viewSeg"><button data-v="students" class="on">حسب الطالب</button><button data-v="records">كل السجلات</button></div>
    </div>
    <div class="row" style="margin-bottom:6px">
      <b style="font-size:14px;color:var(--text-2)">تصفية حسب الصف</b><span class="spacer"></span>
      <button class="btn btn-sm btn-soft" id="allOn">تحديد الكل</button>
      <button class="btn btn-sm btn-ghost" id="allOff">إلغاء التحديد</button>
      <button class="btn btn-sm btn-ghost" id="clearFilters">مسح التصفية</button>
    </div>
    <div class="class-filter" id="classFilter"></div>
  </div>

  <div class="row" style="margin-bottom:10px"><b id="resultLabel" style="color:var(--text-2)"></b></div>
  <div class="table-wrap">
    <table class="table">
      <thead id="thead"></thead>
      <tbody id="tbody"><tr><td colspan="6"><div class="skeleton"></div></td></tr><tr><td colspan="6"><div class="skeleton"></div></td></tr></tbody>
    </table>
  </div>
</main>

<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="modal" id="uiDialog" role="dialog" aria-modal="true">
  <div class="modal-card sm">
    <div id="uiDialogIco" style="font-size:40px;margin-bottom:6px">⚠️</div>
    <h3 class="modal-title" id="uiDialogTitle"></h3>
    <p class="modal-text" id="uiDialogText"></p>
    <div class="pin hidden" id="uiPin">
      <input type="password" inputmode="numeric" maxlength="1" autocomplete="off">
      <input type="password" inputmode="numeric" maxlength="1" autocomplete="off">
      <input type="password" inputmode="numeric" maxlength="1" autocomplete="off">
      <input type="password" inputmode="numeric" maxlength="1" autocomplete="off">
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="uiDialogCancel">إلغاء</button>
      <button class="btn btn-primary" id="uiDialogOk">تأكيد</button>
    </div>
  </div>
</div>
<footer class="footer">برمجة الطالب&nbsp;<b>يحيى حميد</b>&nbsp;| جميع الحقوق محفوظة ©</footer>
<script>
/* ===== أدوات مشتركة ===== */
const UI = (() => {
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  // الوضع الليلي
  function applyTheme(t) { document.documentElement.setAttribute('data-theme', t); const b = document.getElementById('themeBtn'); if (b) b.textContent = t === 'dark' ? '☀️' : '🌙'; }
  applyTheme(store.get('uiTheme', (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light'));
  function toggleTheme() { const t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'; store.set('uiTheme', t); applyTheme(t); document.dispatchEvent(new CustomEvent('themechange', { detail: t })); }

  function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

  function toast(msg, type = 'info', ms = 3200) {
    const wrap = document.getElementById('toasts'); if (!wrap) return;
    const ico = { success: '✅', error: '⛔', info: 'ℹ️' }[type] || 'ℹ️';
    const el = document.createElement('div'); el.className = 'toast ' + type;
    el.innerHTML = `<span>${ico}</span><span>${esc(msg)}</span>`;
    wrap.appendChild(el);
    setTimeout(() => { el.style.transition = '.3s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, ms);
  }

  // نافذة تأكيد / رمز سري — ترجع Promise
  function dialog({ title, text = '', icon = '⚠️', okText = 'تأكيد', danger = false, pin = null }) {
    return new Promise(resolve => {
      const m = document.getElementById('uiDialog');
      const pinBox = document.getElementById('uiPin');
      const inputs = [...pinBox.querySelectorAll('input')];
      const ok = document.getElementById('uiDialogOk'), cancel = document.getElementById('uiDialogCancel');
      document.getElementById('uiDialogTitle').textContent = title;
      document.getElementById('uiDialogText').textContent = text;
      document.getElementById('uiDialogIco').textContent = icon;
      ok.textContent = okText; ok.className = 'btn ' + (danger ? 'btn-danger' : 'btn-primary');
      pinBox.classList.toggle('hidden', !pin); ok.classList.toggle('hidden', !!pin);
      inputs.forEach(i => i.value = '');
      const close = (v) => { m.classList.remove('open'); ok.onclick = cancel.onclick = m.onclick = null; inputs.forEach(i => { i.oninput = i.onkeydown = null; }); document.removeEventListener('keydown', onKey); resolve(v); };
      const onKey = (e) => { if (e.key === 'Escape') close(false); if (e.key === 'Enter' && !pin) close(true); };
      document.addEventListener('keydown', onKey);
      ok.onclick = () => close(true); cancel.onclick = () => close(false);
      m.onclick = (e) => { if (e.target === m) close(false); };
      if (pin) {
        inputs.forEach((inp, i) => {
          inp.oninput = () => {
            inp.value = inp.value.replace(/[^0-9٠-٩]/g, '').replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
            if (inp.value && i < 3) inputs[i + 1].focus();
            const code = inputs.map(x => x.value).join('');
            if (code.length === 4) {
              if ([].concat(pin).includes(code)) close(true);
              else { pinBox.classList.remove('shake'); void pinBox.offsetWidth; pinBox.classList.add('shake'); inputs.forEach(x => x.value = ''); inputs[0].focus(); toast('الرمز غير صحيح', 'error'); }
            }
          };
          inp.onkeydown = (e) => { if (e.key === 'Backspace' && !inp.value && i > 0) inputs[i - 1].focus(); };
        });
      }
      m.classList.add('open');
      setTimeout(() => (pin ? inputs[0] : ok).focus(), 50);
    });
  }

  const toEn = s => String(s ?? '').replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[‎‏؜]/g, '').trim();
  // يحوّل أي صيغة تاريخ إلى YYYY-MM-DD
  function normDate(v) {
    let s = toEn(v); if (!s || s === '-') return '';
    if (s.includes('T')) { const d = new Date(s); if (!isNaN(d)) return d.toLocaleDateString('en-CA', { timeZone: 'Asia/Bahrain' }); s = s.split('T')[0]; }
    const p = s.split(/[\/\-\s.]+/);
    if (p.length >= 3) {
      if (p[0].length === 4) return `${p[0]}-${p[1].padStart(2, '0')}-${p[2].padStart(2, '0')}`;
      if (p[2].length === 4) return `${p[2]}-${p[1].padStart(2, '0')}-${p[0].padStart(2, '0')}`;
    }
    return s;
  }
  const today = () => new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Bahrain' });
  // معرّف ثابت للنص (لا يتغير بتغير ترتيب الصفوف)
  function hashId(str) { let h = 5381; for (const ch of String(str)) h = ((h << 5) + h + ch.codePointAt(0)) >>> 0; return 'id' + h.toString(36); }
  const initials = n => String(n || '؟').trim().split(/\s+/).slice(0, 2).map(w => w[0]).join(' ');

  return { store, toggleTheme, esc, toast, dialog, toEn, normDate, today, hashId, initials };
})();
document.getElementById('themeBtn')?.addEventListener('click', UI.toggleTheme);
// يحدّث النسخة المخزنة القديمة تلقائياً (إن وُجد ملف sw.js في نفس المستودع)
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').then(r => r.update()).catch(() => {}));
}
</script>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbz_Fv_WYg1s25Fz73MXpaRro9Ka3GvkZlwJMvfsGL_aYpNfOq7S3yzbM_N03ZTDShZg/exec";
const ADMIN_CODE = "2000";
const LEVELS = [{ name: "السادس", count: 6 }, { name: "الأول", count: 5 }, { name: "الثاني", count: 5 }, { name: "الثالث", count: 6 }];

let records = [];          // كل السجلات بعد التنظيف
let selected = new Set();  // الصفوف المحددة
let view = 'students';
let busy = false;
const openStudents = new Set();

const $ = id => document.getElementById(id);
const pick = (row, names) => { const k = Object.keys(row).find(k => names.some(n => k.includes(n))); return k ? String(row[k]).trim() : ''; };
const periodNum = p => { const s = UI.toEn(p); const d = s.match(/\d+/); if (d) return d[0]; const w = ['أول|اول', 'ثاني', 'ثالث', 'رابع', 'خامس', 'سادس', 'سابع', 'ثامن']; const i = w.findIndex(x => new RegExp(x).test(s)); return i >= 0 ? String(i + 1) : s; };

/* ===== جلب البيانات ===== */
async function load(silent) {
  if (!silent) $('refreshBtn').disabled = true;
  try {
    const res = await fetch(API_URL, { cache: 'no-store' });
    const data = await res.json();
    records = (Array.isArray(data) ? data : []).map((row, i) => ({
      i, raw: row,
      date: UI.normDate(pick(row, ['تاريخ', 'Date'])),
      period: periodNum(pick(row, ['حصة', 'Period'])),
      cls: pick(row, ['صف', 'Class']),
      student: pick(row, ['طالب', 'Student']),
      teacher: pick(row, ['معلم', 'Teacher'])
    })).filter(r => r.student && r.student !== 'undefined');
    buildClassFilter();
    render();
    if (silent) UI.toast('تم تحديث السجل تلقائياً', 'info', 2000);
  } catch (e) {
    console.error(e);
    $('tbody').innerHTML = `<tr><td colspan="6"><div class="alert alert-danger">⛔ تعذّر الاتصال بالخادم. تأكد من الإنترنت ثم اضغط «تحديث».</div></td></tr>`;
  } finally { $('refreshBtn').disabled = false; }
}

/* ===== فلتر الصفوف ===== */
function allClasses() {
  const known = LEVELS.flatMap(l => Array.from({ length: l.count }, (_, k) => `${l.name} ${k + 1}`));
  const extra = [...new Set(records.map(r => r.cls).filter(c => c && !known.includes(c)))];
  return { known, extra };
}
function buildClassFilter() {
  const { known, extra } = allClasses();
  const first = !$('classFilter').dataset.ready;
  if (first) { known.concat(extra).forEach(c => selected.add(c)); $('classFilter').dataset.ready = 1; }
  else extra.forEach(c => { if (!$('classFilter').querySelector(`[data-c="${CSS.escape(c)}"]`)) selected.add(c); });
  const counts = {}; records.forEach(r => counts[r.cls] = (counts[r.cls] || 0) + 1);
  const chip = c => `<span class="chip ${selected.has(c) ? 'on' : ''}" data-c="${UI.esc(c)}">${UI.esc(c)}${counts[c] ? ` <small style="opacity:.75">(${counts[c]})</small>` : ''}</span>`;
  let html = LEVELS.map(l => `<div class="level-row"><span class="level-name" data-level="${l.name}" title="تحديد/إلغاء المرحلة كاملة">${l.name}</span><div class="chips">${Array.from({ length: l.count }, (_, k) => chip(`${l.name} ${k + 1}`)).join('')}</div></div>`).join('');
  if (extra.length) html += `<div class="level-row"><span class="level-name">أخرى</span><div class="chips">${extra.map(chip).join('')}</div></div>`;
  $('classFilter').innerHTML = html;
}
$('classFilter').addEventListener('click', e => {
  const chip = e.target.closest('.chip'), lvl = e.target.closest('.level-name[data-level]');
  if (chip) { const c = chip.dataset.c; selected.has(c) ? selected.delete(c) : selected.add(c); chip.classList.toggle('on'); render(); }
  if (lvl) {
    const cs = [...lvl.parentElement.querySelectorAll('.chip')].map(x => x.dataset.c);
    const allOn = cs.every(c => selected.has(c));
    cs.forEach(c => allOn ? selected.delete(c) : selected.add(c));
    buildClassFilter(); render();
  }
});
$('allOn').onclick = () => { const { known, extra } = allClasses(); known.concat(extra).forEach(c => selected.add(c)); buildClassFilter(); render(); };
$('allOff').onclick = () => { selected.clear(); buildClassFilter(); render(); };
$('clearFilters').onclick = () => { $('search').value = ''; $('dateFilter').value = ''; $('allOn').onclick(); };

/* ===== التصفية والعرض ===== */
function filtered() {
  const q = UI.toEn($('search').value).toLowerCase();
  const d = $('dateFilter').value;
  return records.filter(r =>
    selected.has(r.cls) &&
    (!d || r.date === d) &&
    (!q || `${r.student} ${r.teacher} ${r.cls}`.toLowerCase().includes(q)));
}
function groupByStudent(list) {
  const m = new Map();
  list.forEach(r => {
    if (!m.has(r.student)) m.set(r.student, { student: r.student, cls: r.cls, items: [] });
    m.get(r.student).items.push(r);
  });
  return [...m.values()].map(g => { g.items.sort((a, b) => b.date.localeCompare(a.date) || a.period - b.period); g.last = g.items[0].date; g.days = new Set(g.items.map(x => x.date)).size; return g; })
    .sort((a, b) => b.last.localeCompare(a.last) || b.items.length - a.items.length);
}

function render() {
  const list = filtered();
  const todayStr = UI.today();
  $('sTotal').textContent = records.length;
  $('sStudents').textContent = new Set(list.map(r => r.student)).size;
  $('sToday').textContent = new Set(records.filter(r => r.date === todayStr).map(r => r.student)).size;
  $('sClasses').textContent = new Set(list.map(r => r.cls)).size;

  const tb = $('tbody');
  if (view === 'students') {
    $('thead').innerHTML = `<tr><th>الطالب</th><th>الصف</th><th>عدد الحصص</th><th>عدد الأيام</th><th>آخر غياب</th><th class="no-print">الإجراء</th></tr>`;
    const groups = groupByStudent(list);
    $('resultLabel').textContent = `${groups.length} طالب — ${list.length} سجل`;
    if (!groups.length) { tb.innerHTML = emptyRow(); return; }
    tb.innerHTML = groups.map((g, idx) => {
      const open = openStudents.has(g.student);
      const main = `<tr class="${open ? 'open' : ''}" data-s="${UI.esc(g.student)}">
        <td class="student-cell" data-toggle="1"><span class="arrow">◀</span>${UI.esc(g.student)}</td>
        <td><span class="badge tone-primary">${UI.esc(g.cls)}</span></td>
        <td><span class="badge count-pill ${g.items.length >= 5 ? 'tone-danger' : 'tone-warning'}">${g.items.length}</span></td>
        <td>${g.days}</td>
        <td>${fmtDate(g.last)}</td>
        <td class="no-print"><button class="btn btn-sm btn-danger-soft" data-del-student="${UI.esc(g.student)}">حذف الطالب</button></td></tr>`;
      const det = open ? `<tr class="expand"><td colspan="6"><div class="days">${g.items.map(r =>
        `<span class="day">${fmtDate(r.date)} • الحصة ${UI.esc(r.period || '-')} • ${UI.esc(r.teacher || '-')}<button title="حذف هذا الغياب فقط" data-del-rec="${r.i}">✕</button></span>`).join('')}</div></td></tr>` : '';
      return main + det;
    }).join('');
  } else {
    $('thead').innerHTML = `<tr><th>التاريخ</th><th>الحصة</th><th>الصف</th><th>الطالب</th><th>المعلم</th><th class="no-print">الإجراء</th></tr>`;
    const sorted = [...list].sort((a, b) => b.date.localeCompare(a.date) || a.period - b.period);
    $('resultLabel').textContent = `${sorted.length} سجل`;
    if (!sorted.length) { tb.innerHTML = emptyRow(); return; }
    tb.innerHTML = sorted.map(r => `<tr>
      <td>${fmtDate(r.date)}</td><td><span class="badge tone-info">${UI.esc(r.period || '-')}</span></td>
      <td><span class="badge tone-primary">${UI.esc(r.cls)}</span></td><td><b>${UI.esc(r.student)}</b></td>
      <td style="color:var(--text-2)">${UI.esc(r.teacher || '-')}</td>
      <td class="no-print"><button class="btn btn-sm btn-danger-soft" data-del-rec="${r.i}">حذف</button></td></tr>`).join('');
  }
}
const emptyRow = () => `<tr><td colspan="6"><div class="empty"><span class="empty-ico">🎉</span>${records.length ? 'لا توجد نتائج مطابقة للتصفية' : 'لا توجد غيابات مسجلة'}</div></td></tr>`;
function fmtDate(d) { if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) return UI.esc(d || '-'); const [y, m, dd] = d.split('-'); const dn = new Date(+y, m - 1, +dd).toLocaleDateString('ar', { weekday: 'short' }); return `${dn} ${+dd}/${+m}/${y}`; }

$('search').addEventListener('input', render);
$('dateFilter').addEventListener('change', render);
$('viewSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; view = b.dataset.v; [...$('viewSeg').children].forEach(x => x.classList.toggle('on', x === b)); render(); });
$('tbody').addEventListener('click', async e => {
  const t = e.target.closest('[data-toggle]');
  if (t) { const s = t.parentElement.dataset.s; openStudents.has(s) ? openStudents.delete(s) : openStudents.add(s); render(); return; }
  const ds = e.target.closest('[data-del-student]');
  if (ds) return deleteStudent(ds.dataset.delStudent);
  const dr = e.target.closest('[data-del-rec]');
  if (dr) return deleteRecord(+dr.dataset.delRec);
});

/* ===== الحذف ===== */
function post(body) { return fetch(API_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) }); }
function notifyOthers() { try { db && db.ref('system/lastUpdate').set(Date.now()); } catch (e) {} }
async function withBusy(fn) { busy = true; try { await fn(); } finally { busy = false; } }

async function deleteRecord(i) {
  const r = records.find(x => x.i === i); if (!r) return;
  const ok = await UI.dialog({ title: 'حذف غياب واحد', text: `${r.student} — ${fmtDate(r.date)} — الحصة ${r.period}. أدخل رمز الإدارة للتأكيد:`, icon: '🔒', pin: ADMIN_CODE });
  if (!ok) return;
  await withBusy(async () => {
    try { await post({ action: 'deleteRowMatch', rowData: r.raw }); records = records.filter(x => x !== r); notifyOthers(); render(); UI.toast('تم حذف الغياب', 'success'); }
    catch (e) { UI.toast('حدث خطأ أثناء الاتصال بالخادم', 'error'); }
  });
}
async function deleteStudent(name) {
  const rows = records.filter(r => r.student === name);   // يبحث بالاسم الحقيقي وليس برقم الصف
  const ok = await UI.dialog({ title: 'حذف جميع غيابات الطالب', text: `سيتم حذف ${rows.length} سجل للطالب «${name}». أدخل رمز الإدارة للتأكيد:`, icon: '🔒', pin: ADMIN_CODE });
  if (!ok) return;
  await withBusy(async () => {
    UI.toast(`جارٍ حذف ${rows.length} سجل...`, 'info', 1800);
    try {
      for (const r of rows) await post({ action: 'deleteRowMatch', rowData: r.raw }); // واحد تلو الآخر لتجنب تعارض الحذف في الشيت
      records = records.filter(r => r.student !== name); openStudents.delete(name); notifyOthers(); render();
      UI.toast('تم حذف الطالب من السجل', 'success');
    } catch (e) { UI.toast('حدث خطأ أثناء الاتصال بالخادم', 'error'); }
  });
}
$('deleteAllBtn').onclick = async () => {
  const ok1 = await UI.dialog({ title: 'حذف جميع السجلات؟', text: `سيتم مسح ${records.length} سجل نهائياً ولا يمكن التراجع. ننصح بالتصدير إلى Excel أولاً.`, icon: '🔥', okText: 'متابعة', danger: true });
  if (!ok1) return;
  const ok2 = await UI.dialog({ title: 'رمز الإدارة', text: 'أدخل الرمز لتأكيد مسح السجل بالكامل', icon: '🔒', pin: ADMIN_CODE });
  if (!ok2) return;
  await withBusy(async () => {
    try { await post({ action: 'deleteAll' }); records = []; notifyOthers(); buildClassFilter(); render(); UI.toast('تم مسح جميع السجلات', 'success'); }
    catch (e) { UI.toast('حدث خطأ أثناء الاتصال بالخادم', 'error'); }
  });
};

/* ===== التصدير ===== */
$('exportBtn').onclick = () => {
  const list = filtered();
  if (!list.length) return UI.toast('لا توجد بيانات للتصدير', 'error');
  const rows = [['التاريخ', 'الحصة', 'الصف', 'الطالب', 'المعلم'], ...list.map(r => [r.date, r.period, r.cls, r.student, r.teacher])];
  const csv = '﻿' + rows.map(r => r.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `سجل-الغياب-${UI.today()}.csv`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
$('refreshBtn').onclick = () => load(false);

/* ===== التحديث التلقائي (يحافظ على البحث والتصفية) ===== */
let first = true;
if (db) db.ref('system/lastUpdate').on('value', () => { if (first) { first = false; return; } if (!busy) load(true); });
load(false);
</script>
<script>
/* ملخص بيانات الغياب للمساعد الذكي (محسوب بدقة هنا قبل الإرسال) */
function absenceSummary(list, extra) {
  const L = [];
  const dates = list.map(r => r.date).filter(Boolean).sort();
  L.push(`تاريخ اليوم: ${UI.today()}`);
  if (extra) L.push(extra);
  L.push(`إجمالي سجلات الغياب: ${list.length} | عدد الطلاب المختلفين: ${new Set(list.map(r => r.student)).size}` + (dates.length ? ` | من ${dates[0]} إلى ${dates[dates.length - 1]}` : ''));
  const by = (key) => { const m = new Map(); list.forEach(r => { const k = key(r); if (!m.has(k)) m.set(k, []); m.get(k).push(r); }); return m; };
  L.push('\n[الصفوف] الصف | عدد السجلات | عدد الطلاب');
  [...by(r => r.cls)].sort((a, b) => a[0].localeCompare(b[0], 'ar', { numeric: true })).forEach(([c, rs]) => L.push(`${c} | ${rs.length} | ${new Set(rs.map(r => r.student)).size}`));
  L.push('\n[الأيام] التاريخ | عدد الطلاب الغائبين | عدد السجلات');
  [...by(r => r.date)].sort((a, b) => b[0].localeCompare(a[0])).slice(0, 90).forEach(([d, rs]) => L.push(`${d} | ${new Set(rs.map(r => r.student)).size} | ${rs.length}`));
  L.push('\n[المعلمون] المعلم | عدد السجلات التي سجلها');
  [...by(r => r.teacher || 'غير معروف')].sort((a, b) => b[1].length - a[1].length).forEach(([t, rs]) => L.push(`${t} | ${rs.length}`));
  L.push('\n[الحصص] رقم الحصة | عدد السجلات');
  [...by(r => r.period || '?')].sort((a, b) => a[0] - b[0]).forEach(([p, rs]) => L.push(`${p} | ${rs.length}`));
  L.push('\n[الطلاب] (مرتبون من الأكثر غياباً) الاسم | الصف | عدد الحصص الغائب فيها | عدد الأيام | آخر غياب | التواريخ (أرقام الحصص)');
  [...by(r => r.student)].sort((a, b) => b[1].length - a[1].length).forEach(([name, rs]) => {
    const perDay = new Map();
    rs.forEach(r => { if (!perDay.has(r.date)) perDay.set(r.date, []); perDay.get(r.date).push(r.period || '?'); });
    const days = [...perDay].sort((a, b) => b[0].localeCompare(a[0]));
    L.push(`${name} | ${rs[0].cls} | ${rs.length} | ${perDay.size} | ${days[0][0]} | ` + days.slice(0, 25).map(([dt, ps]) => `${dt}(ح${ps.join('،ح')})`).join(' ') + (days.length > 25 ? ' …' : ''));
  });
  return L.join('\n');
}
</script>

button.brand:hover .brand-logo{transform:scale(1.06)}
.aia-pulse{position:relative}
.aia-pulse::after{content:"";position:absolute;inset:-4px;border-radius:14px;border:2px solid var(--primary);opacity:0;animation:aiaPulse 2.4s ease-out infinite}
@keyframes aiaPulse{0%{opacity:.7;transform:scale(.9)}80%,100%{opacity:0;transform:scale(1.25)}}
.aia-panel{position:fixed;inset:0;z-index:1500;display:none;background:rgba(13,15,40,.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.aia-panel.open{display:block;animation:fadeIn .2s}
.aia-box{position:absolute;top:70px;inset-inline-start:16px;width:420px;max-width:calc(100% - 32px);height:min(640px,calc(100vh - 130px));background:var(--surface);border:1px solid var(--border);border-radius:22px;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;overflow:hidden}
.aia-head{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--grad);color:#fff;flex-shrink:0}
.aia-head .lg{width:30px;height:30px;border-radius:10px;background:rgba(255,255,255,.2);display:grid;place-items:center}
.aia-head b{font-size:15px}
.aia-head .x{margin-inline-start:auto;background:rgba(255,255,255,.18);border:0;color:#fff;width:32px;height:32px;border-radius:10px;cursor:pointer;font-size:15px}
.aia-msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--surface-2)}
.aia-msg{max-width:88%;padding:9px 13px;border-radius:16px;line-height:1.8;word-wrap:break-word;font-size:14.5px}
.aia-msg.user{align-self:flex-start;background:var(--grad);color:#fff;border-start-start-radius:5px;white-space:pre-wrap}
.aia-msg.model{align-self:flex-end;background:var(--surface);border:1px solid var(--border);border-start-end-radius:5px}
.aia-msg h2,.aia-msg h3{font-size:15px;margin:8px 0 4px;color:var(--primary-ink)}
[data-theme="dark"] .aia-msg h2,[data-theme="dark"] .aia-msg h3{color:var(--primary-2)}
.aia-msg ul,.aia-msg ol{margin:4px 0;padding-inline-start:20px}.aia-msg p{margin:4px 0}
.aia-msg table{border-collapse:collapse;width:100%;font-size:13px;margin:6px 0}.aia-msg td,.aia-msg th{border:1px solid var(--border);padding:4px 6px}
.aia-welcome{text-align:center;color:var(--muted);padding:14px 6px;font-weight:600}
.aia-welcome .big{font-size:36px}
.aia-chips{display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px 0}
.aia-chips .chip{font-size:13px;padding:5px 11px}
.aia-comp{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--border);align-items:flex-end}
.aia-comp textarea{resize:none;min-height:44px;max-height:120px;font-size:14.5px}
.aia-typing{display:inline-flex;gap:4px;padding:4px 2px}
.aia-typing i{width:7px;height:7px;border-radius:50%;background:var(--primary);animation:aiaDot 1s infinite}
.aia-typing i:nth-child(2){animation-delay:.15s}.aia-typing i:nth-child(3){animation-delay:.3s}
@keyframes aiaDot{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media(max-width:600px){.aia-box{inset:0;width:auto;max-width:none;height:auto;border-radius:0}}
@media print{.aia-panel{display:none!important}}
</style>
<div class="aia-panel" id="aiaPanel" role="dialog" aria-modal="true" aria-label="المساعد الذكي">
  <div class="aia-box">
    <div class="aia-head"><span class="lg">✦</span><b>المساعد الذكي</b><button class="x" id="aiaClose" aria-label="إغلاق">✕</button></div>
    <div class="aia-msgs" id="aiaMsgs"><div class="aia-welcome" id="aiaWelcome"><div class="big">✦</div><div id="aiaIntro"></div></div></div>
    <div class="aia-chips" id="aiaChips"></div>
    <div class="aia-comp">
      <textarea class="textarea" id="aiaInput" rows="1" placeholder="اسأل عن هذه الصفحة أو بياناتها..."></textarea>
      <button class="btn btn-primary" id="aiaSend">إرسال ➤</button>
    </div>
  </div>
</div>
<script>
/* رابط Apps Script للمساعد الذكي (نفس رابط الموقع الرئيسي) */
const AI_URL = "https://script.google.com/macros/s/AKfycbyT3LkNM9vig5WegHLa-_lkACMhyrVUfRGwkh2YATWuANUhPCO0tZYPF6LSNpPkpTdk/exec";
(function () {
  const P = window.AI_PAGE; if (!P) return;
  const $ = id => document.getElementById(id);
  let chat = [], busy = false;
  $('aiaIntro').textContent = P.intro;
  $('aiaChips').innerHTML = (P.chips || []).map(c => `<button class="chip" data-q="${UI.esc(c)}">${UI.esc(c)}</button>`).join('');

  const open = () => { $('aiaPanel').classList.add('open'); if (matchMedia('(hover:hover)').matches) setTimeout(() => $('aiaInput').focus(), 50); };
  const close = () => $('aiaPanel').classList.remove('open');
  $('aiaFab').onclick = open; $('aiaClose').onclick = close;
  $('aiaPanel').addEventListener('click', e => { if (e.target.id === 'aiaPanel') close(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('aiaPanel').classList.contains('open')) close(); });

  function md(src) {
    const inline = s => UI.esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>');
    let html = '', list = null, table = [];
    const fl = () => { if (list) { html += `</${list}>`; list = null; } };
    const ft = () => { if (!table.length) return; const rows = table.filter(r => !/^\s*\|?\s*:?-{2,}/.test(r)).map(r => r.trim().replace(/^\||\|$/g, '').split('|')); html += '<table>' + rows.map((r, i) => '<tr>' + r.map(c => i ? `<td>${inline(c.trim())}</td>` : `<th>${inline(c.trim())}</th>`).join('') + '</tr>').join('') + '</table>'; table = []; };
    for (const line of String(src || '').replace(/\r/g, '').split('\n')) {
      if (/^\s*\|.*\|\s*$/.test(line)) { fl(); table.push(line); continue; } else ft();
      let m;
      if ((m = line.match(/^\s*#{1,4}\s+(.*)/))) { fl(); html += `<h3>${inline(m[1])}</h3>`; }
      else if ((m = line.match(/^\s*[-*•]\s+(.*)/))) { if (list !== 'ul') { fl(); html += '<ul>'; list = 'ul'; } html += `<li>${inline(m[1])}</li>`; }
      else if ((m = line.match(/^\s*\d+[.)]\s+(.*)/))) { if (list !== 'ol') { fl(); html += '<ol>'; list = 'ol'; } html += `<li>${inline(m[1])}</li>`; }
      else if (!line.trim()) fl();
      else { fl(); html += `<p>${inline(line)}</p>`; }
    }
    fl(); ft(); return html;
  }
  function add(role, html) {
    $('aiaWelcome')?.remove(); $('aiaChips').style.display = 'none';
    const d = document.createElement('div'); d.className = 'aia-msg ' + role; d.innerHTML = html;
    $('aiaMsgs').appendChild(d); $('aiaMsgs').scrollTop = $('aiaMsgs').scrollHeight; return d;
  }
  async function send(text) {
    text = (text ?? $('aiaInput').value).trim(); if (!text || busy) return;
    $('aiaInput').value = ''; size();
    add('user', UI.esc(text)); chat.push({ role: 'user', text });
    const pend = add('model', '<div class="aia-typing"><i></i><i></i><i></i></div>');
    busy = true; $('aiaSend').disabled = true;
    try {
      let ctx = '';
      try { ctx = P.context(); } catch (e) { console.error(e); ctx = '(تعذّر تجهيز بيانات الصفحة)'; }
      let res;
      try { res = await fetch(AI_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ mode: 'page', page: P.id, context: ctx, messages: chat, teacher: 'الإدارة - ' + P.title }) }); }
      catch (e) { throw new Error(location.protocol.startsWith('http') ? 'تعذّر الوصول إلى المساعد. تأكد من الإنترنت.' : 'افتح الصفحة من رابطها على GitHub حتى يعمل المساعد.'); }
      let data; try { data = await res.json(); } catch (e) { throw new Error('المساعد لم يرجع رداً صحيحاً. حاول مرة أخرى.'); }
      if (data.error) throw new Error(data.error);
      chat.push({ role: 'model', text: data.text });
      pend.innerHTML = md(data.text);
    } catch (e) { chat.pop(); pend.innerHTML = `<div class="alert alert-danger">⛔ ${UI.esc(e.message)}</div>`; }
    finally { busy = false; $('aiaSend').disabled = false; $('aiaMsgs').scrollTop = $('aiaMsgs').scrollHeight; }
  }
  function size() { const i = $('aiaInput'); i.style.height = 'auto'; i.style.height = Math.min(i.scrollHeight, 120) + 'px'; }
  $('aiaInput').addEventListener('input', size);
  $('aiaInput').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
  $('aiaSend').onclick = () => send();
  $('aiaChips').addEventListener('click', e => {
    const c = e.target.closest('[data-q]'); if (!c) return;
    const q = c.dataset.q;
    if (q.includes('...')) { const i = $('aiaInput'); i.value = q.replace(/\.\.\.؟?/, '').trim() + ' '; i.focus(); i.setSelectionRange(i.value.length, i.value.length); size(); }
    else send(q);
  });
})();
</script>

</body>
</html>
